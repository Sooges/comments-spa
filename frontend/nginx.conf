# needed for the WebSocket connection of SignalR
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the biggest request of the API is a comment with a file (up to 5 MB)
    client_max_body_size 6m;

    # The DNS server of Docker. nginx looks for the address of the "api" container again every 10 seconds
    # (see the variable in proxy_pass below), so the site keeps working when the API container is
    # created again and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # If the site is behind another proxy (for example Caddy with HTTPS), the real address of the visitor is
    # taken from X-Forwarded-For. It is trusted only when the request comes from a private network.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # requests to the API
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket)
    location /hubs/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # The files of the application have a hash in the name and never change, so they can be kept for a year.
    location ~* \.(js|css)$ {
        expires 1y;
    }

    # The start page must not be kept: it points to the files with the new hashes after an update.
    location = /index.html {
        expires -1;
    }

    # the pages of the application
    location / {
        try_files $uri $uri/ /index.html;
    }
}
